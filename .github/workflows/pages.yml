name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --include=optional
      - name: Build Pages app
        run: npm run build:pages
        env:
          VITE_HOME_API_BASE_URL: https://jryoxyudbeldzqbnsbfl.functions.supabase.co/home-api
          VITE_SUPABASE_URL: https://jryoxyudbeldzqbnsbfl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MeFasTrVGAGOJB4w83AwXg_fAhllD-J
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
